# Web, işçi ve yedek servislerinin logları systemd journal'a yazılır; bu ayar toplam boyutu ve süreyi sınırlar.
# Kopyala: sudo mkdir -p /etc/systemd/journald.conf.d && sudo cp deploy/journald-harita-crm.conf /etc/systemd/journald.conf.d/harita-crm.conf && sudo systemctl restart systemd-journald
[Journal]
SystemMaxUse=500M
SystemMaxFileSize=50M
MaxRetentionSec=1month
